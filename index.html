
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOSKU by @zona.prodig</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172b4d;
    }
    header {
      background: #102746;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }
    header h1 { margin: 0; font-size: 30px; }
    header p { margin-bottom: 0; color: #d5e3f5; }
    main {
      max-width: 430px;
      margin: 35px auto;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 26px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #10274612;
    }
    h2 { margin-top: 0; }
    p { line-height: 1.6; color: #607087; }
    label { display: block; margin: 16px 0 7px; }
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5deea;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #176b52;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 20px;
      font-size: 12px;
      color: #8290a3;
    }
  </style>
</head>
<body>
  <header>
    <h1>KOSKU</h1>
    <p>Manajemen Kos & Kontrakan</p>
    <small>by @zona.prodig</small>
  </header>

  <main>
    <section class="card">
      <h2>Selamat Datang!</h2>
      <p>Kelola properti kos dan kontrakan dengan lebih mudah, praktis, dan teratur.</p>

      <label for="email">Email</label>
      <input id="email" type="email" placeholder="Masukkan email">

      <label for="password">Password</label>
      <input id="password" type="password" placeholder="Masukkan password">

      <button type="button">Masuk</button>
      <p style="text-align:center">Belum punya akun? Daftar segera.</p>
    </section>
  </main>

  <footer>© 2026 @zona.prodig. All Rights Reserved.</footer>
</body>
</html>
